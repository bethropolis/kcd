version: "2"

linters:
  enable:
    - govet
    - staticcheck
    - unused
    - ineffassign
    - bodyclose
    - noctx
    - unparam
    - misspell
    - depguard
  disable:
    - errcheck

  settings:
    govet:
      enable-all: true
      disable:
        - shadow
        - fieldalignment
    depguard:
      rules:
        logging-seam:
          files:
            - $all
            - '!**/internal/log/**'
          deny:
            - pkg: go.uber.org/zap
              desc: 'import internal/log instead of go.uber.org/zap directly'

  exclusions:
    rules:
      - path: "_test\\.go"
        linters:
          - unparam
          - unused
      - path: "scripts/"
        linters:
          - all

formatters:
  enable:
    - gofmt

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
