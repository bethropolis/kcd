version: 2

project_name: kcd

before:
  hooks:
    - go mod tidy
    - go mod verify

builds:
  - id: kcd
    main: ./cmd/kcd
    binary: kcd
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - "7"

    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - id: default
    ids:
      - kcd
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "arm64" }}aarch64
      {{- else if eq .Arch "arm" }}armv7
      {{- else }}{{ .Arch }}{{ end }}
    formats:
      - tar.gz
    files:
      - README.md
      - LICENSE
      - packaging/kcd.example.toml
      - packaging/kcd-user.service
      - packaging/kcd-pkg.service
      - packaging/kcd-system.service
      - packaging/ufw-kcd
      - packaging/firewalld-kcd.xml
      - packaging/nautilus-kcd.py
      - scripts/install.sh
      - scripts/uninstall.sh
      - packaging/kcd.bash-completion
      - packaging/kcd.zsh-completion
      - packaging/kcd.fish-completion

aurs:
  - name: kcd-bin
    homepage: "https://github.com/bethropolis/kcd"
    description: |
      Lightweight, headless implementation of the KDE Connect protocol (v8) written in Go
    maintainers:
      - "bethropolis <bethropolis at gmail dot com>"
    license: "MIT"
    private_key: "{{ .Env.AUR_KEY }}"
    git_url: "ssh://aur@aur.archlinux.org/kcd-bin.git"
    provides:
      - kcd
    conflicts:
      - kcd
    depends:
      - glibc
    optdepends:
      - "libnotify: for desktop notifications"
      - "wl-clipboard: for Wayland clipboard sync"
      - "xclip: for X11 clipboard sync"
      - "sshfs: for SFTP mounting support"
      - "playerctl: for MPRIS media control"
      - "ydotool: for Wayland mousepad support"
      - "xdotool: for X11 mousepad support"
      - "wtype: for Wayland keyboard emulation"
      - "python-nautilus: for Nautilus file manager integration"
    package: |-
      install -Dm755 "./kcd" "${pkgdir}/usr/bin/kcd"

      install -Dm644 "./packaging/kcd-pkg.service" "${pkgdir}/usr/lib/systemd/user/kcd.service"
      install -Dm644 "./packaging/kcd-system.service" "${pkgdir}/usr/lib/systemd/system/kcd@.service"

      install -Dm644 "./packaging/kcd.example.toml" "${pkgdir}/usr/share/doc/kcd/kcd.example.toml"
      install -Dm644 "./README.md" "${pkgdir}/usr/share/doc/kcd/README.md"

      install -Dm644 "./packaging/kcd.bash-completion" "${pkgdir}/usr/share/bash-completion/completions/kcd"
      install -Dm644 "./packaging/kcd.zsh-completion" "${pkgdir}/usr/share/zsh/site-functions/_kcd"
      install -Dm644 "./packaging/kcd.fish-completion" "${pkgdir}/usr/share/fish/vendor_completions.d/kcd.fish"

      install -Dm644 "./packaging/nautilus-kcd.py" "${pkgdir}/usr/share/nautilus-python/extensions/nautilus-kcd.py"

      install -Dm644 "./packaging/firewalld-kcd.xml" "${pkgdir}/usr/lib/firewalld/services/kcd.xml"
      install -Dm644 "./packaging/ufw-kcd" "${pkgdir}/etc/ufw/applications.d/kcd"

      install -Dm644 "./LICENSE" "${pkgdir}/usr/share/licenses/kcd-bin/LICENSE"

nfpms:
  - id: packages
    package_name: kcd
    file_name_template: >-
      {{ .PackageName }}_
      {{- .Version }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "arm64" }}aarch64
      {{- else if eq .Arch "arm" }}armv7
      {{- else }}{{ .Arch }}{{ end }}
    vendor: bethropolis
    homepage: https://github.com/bethropolis/kcd
    maintainer: bethropolis
    description: |
      kcd is a lightweight, headless implementation of the KDE Connect protocol (v8)
      written in Go. It allows Linux servers and minimal desktop environments to
      interact with the KDE Connect ecosystem without a GUI or heavy dependencies.
    license: MIT
    formats:
      - deb
      - rpm
    bindir: /usr/bin
    contents:
      - src: packaging/kcd-pkg.service
        dst: /usr/lib/systemd/user/kcd.service
        type: config|noreplace
      - src: packaging/kcd-system.service
        dst: /usr/lib/systemd/system/kcd@.service
        type: config|noreplace
      - src: packaging/kcd.example.toml
        dst: /usr/share/doc/kcd/kcd.example.toml
      - src: packaging/ufw-kcd
        dst: /etc/ufw/applications.d/kcd
        type: config|noreplace
        packager: deb
      - src: packaging/firewalld-kcd.xml
        dst: /etc/firewalld/services/kcd.xml
        type: config|noreplace
        packager: rpm
      - src: packaging/nautilus-kcd.py
        dst: /usr/share/doc/kcd/nautilus-kcd.py
      - src: README.md
        dst: /usr/share/doc/kcd/README.md
      - src: packaging/kcd.bash-completion
        dst: /etc/bash_completion.d/kcd
        packager: deb
      - src: packaging/kcd.bash-completion
        dst: /etc/bash_completion.d/kcd
        packager: rpm
      - src: packaging/kcd.zsh-completion
        dst: /usr/share/zsh/site-functions/_kcd
      - src: packaging/kcd.fish-completion
        dst: /usr/share/fish/completions/kcd.fish
    scripts:
      postinstall: scripts/postinstall.sh
      preremove: scripts/preremove.sh
    deb:
      lintian_overrides:
        - statically-linked-binary
    rpm:
      summary: Headless KDE Connect daemon

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

changelog:
  use: github
  sort: asc
  abbrev: 0
  groups:
    - title: "New Features"
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: "Bug Fixes"
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: "Performance"
      regexp: '^.*?perf(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: "Other Changes"
      order: 999
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^ci:"
      - "^test:"
      - "^refactor:"
      - "typo"
      - "Merge pull request"
      - "Merge branch"

release:
  github:
    owner: bethropolis
    name: kcd
  name_template: "v{{.Version}}"
  draft: false
  prerelease: auto
  make_latest: true
  header: |
    ## kcd v{{ .Version }}

    Headless KDE Connect daemon for Linux.

    ### Installation

    **Quick install (Linux amd64):**
    ```bash
    curl -sSL https://github.com/bethropolis/kcd/releases/download/v{{ .Version }}/kcd_{{ .Version }}_x86_64.tar.gz | tar -xz
    sudo mv kcd /usr/local/bin/
    ```

    **Debian / Ubuntu:**
    ```bash
    curl -LO https://github.com/bethropolis/kcd/releases/download/v{{ .Version }}/kcd_{{ .Version }}_x86_64.deb
    sudo dpkg -i kcd_{{ .Version }}_x86_64.deb
    ```

    **Fedora / RHEL:**
    ```bash
    curl -LO https://github.com/bethropolis/kcd/releases/download/v{{ .Version }}/kcd_{{ .Version }}_x86_64.rpm
    sudo rpm -i kcd_{{ .Version }}_x86_64.rpm
    ```
  footer: |
    **Full Changelog:** https://github.com/bethropolis/kcd/compare/{{ .PreviousTag }}...v{{ .Version }}
